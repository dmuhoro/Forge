name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestrator-core:
    name: orchestrator-core (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Self-proof (engine + journal + CLI at the real boundary)
        run: python3 -m unittest discover -s tests -v